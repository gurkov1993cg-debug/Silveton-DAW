name: Silveton Intel Full VST3 Validation

on:
  workflow_dispatch:
  push:
    paths:
      - 'SilvetonDAW-source.zip'
      - '.github/workflows/silveton-coreaudio-intel.yml'

jobs:
  intel-vst3:
    runs-on: macos-15-intel
    timeout-minutes: 55

    steps:
      - name: Checkout Silveton package
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Show locked toolchain
        run: |
          set -euxo pipefail
          sw_vers
          xcodebuild -version
          cmake --version
          clang++ --version
          test "$(uname -m)" = "x86_64"

      - name: Extract source ZIP
        run: |
          set -euxo pipefail
          test -f SilvetonDAW-source.zip
          rm -rf _silveton_src
          mkdir _silveton_src
          ditto -x -k SilvetonDAW-source.zip _silveton_src
          ROOT="_silveton_src/SilvetonDAW"
          test -f "$ROOT/CMakeLists.txt"
          test -f "$ROOT/app/SilvetonApp.mm"
          test -f "$ROOT/src/AudioEngine.cpp"
          test -f "$ROOT/src/ProcessorGraph.cpp"
          test -f "$ROOT/src/Vst3Host.cpp"
          test -f "$ROOT/src/CoreMidiInput.mm"
          test -f "$ROOT/tests/Vst3HostIntegrationTests.cpp"
          test -f "$ROOT/tests/vst3/SilvetonHostTest.cpp"
          grep -F 'project(SilvetonDAW VERSION 0.16.0' "$ROOT/CMakeLists.txt"

      - name: Checkout exact pinned Steinberg VST3 SDK
        run: |
          set -euxo pipefail
          rm -rf vst3sdk
          git clone https://github.com/steinbergmedia/vst3sdk.git vst3sdk
          git -C vst3sdk checkout 3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96
          git -C vst3sdk submodule update --init --recursive
          test "$(git -C vst3sdk rev-parse HEAD)" = "3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96"
          test "$(git -C vst3sdk/public.sdk rev-parse HEAD)" = "586dc5e6c8012c3e4b01c79389375cbe96bdb1da"
          test "$(git -C vst3sdk/pluginterfaces rev-parse HEAD)" = "4f547e8e102b47de4a8b8aaf343c73b700786372"
          test "$(git -C vst3sdk/cmake rev-parse HEAD)" = "054c9143cbb8d47fc4694e473f2ee3b4d951a8f5"

      - name: Verify macOS 10.13 source contract
        run: |
          set -euxo pipefail
          ROOT="_silveton_src/SilvetonDAW"
          if grep -R --line-number --include='*.h' --include='*.cpp' --include='*.mm' 'std::filesystem' \
              "$ROOT/include" "$ROOT/src" "$ROOT/tests" "$ROOT/app"; then
            echo 'std::filesystem is not allowed for the macOS 10.13 target'
            exit 1
          fi

      - name: Configure Release with production VST3 host
        run: |
          set -euxo pipefail
          cmake -S _silveton_src/SilvetonDAW -B build \
            -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DSILVETON_ENABLE_VST3_HOST=ON \
            -DSILVETON_BUILD_VST3_VALIDATOR=ON \
            -DSILVETON_VST3_SDK_DIR="$GITHUB_WORKSPACE/vst3sdk" \
            -DSMTG_BUILD_UNIVERSAL_BINARY=OFF \
            -DSMTG_CREATE_PLUGIN_LINK=OFF

      - name: Build Release
        run: cmake --build build --config Release --parallel 2

      - name: Run complete Release regression suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Resolve native outputs
        run: |
          set -euxo pipefail
          APP="$(find build -type d -name 'Silveton.app' -print -quit)"
          PLUGIN="$(find build -type d -name 'SilvetonHostTest.vst3' -print -quit)"
          VALIDATOR="$(find build -type f -name validator -perm -111 -print -quit)"
          CORE_AUDIO_SMOKE="$(find build -type f -name 'silveton_coreaudio_smoke' -perm -111 -print -quit)"
          VST3_SCANNER="$(find build -type f -name 'silveton_vst3_scanner' -perm -111 -print -quit)"
          VST3_HOST_TESTS="$(find build -type f -name 'silveton_vst3_host_integration_tests' -perm -111 -print -quit)"
          VST3_INFRA_TESTS="$(find build -type f -name 'silveton_vst3_infrastructure_tests' -perm -111 -print -quit)"
          AUDIO_CORE_LIB="$(find build -type f -name 'libsilveton_audio_core.a' -print -quit)"
          for v in APP PLUGIN VALIDATOR CORE_AUDIO_SMOKE VST3_SCANNER VST3_HOST_TESTS VST3_INFRA_TESTS AUDIO_CORE_LIB; do
            test -n "${!v}"
            echo "$v=${!v}" >> "$GITHUB_ENV"
          done
          test -x "$APP/Contents/MacOS/Silveton"
          test -x "$APP/Contents/Resources/silveton_vst3_scanner"

      - name: Run VST3 host integration explicitly
        run: |
          set -euxo pipefail
          "$VST3_HOST_TESTS" "$PLUGIN" "$VST3_SCANNER"

      - name: Run Steinberg validator explicitly
        run: |
          set -euxo pipefail
          "$VALIDATOR" "$PLUGIN"

      - name: Sign and verify native bundles
        run: |
          set -euxo pipefail
          codesign --force --deep --sign - "$PLUGIN"
          codesign --verify --deep --strict --verbose=2 "$PLUGIN"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Verify x86_64-only and macOS 10.13 deployment
        run: |
          set -euxo pipefail
          APP_BIN="$APP/Contents/MacOS/Silveton"
          PLUGIN_BIN="$(find "$PLUGIN/Contents/MacOS" -type f -perm -111 -print -quit)"
          for f in "$APP_BIN" "$PLUGIN_BIN" "$CORE_AUDIO_SMOKE" "$VST3_SCANNER" "$VST3_HOST_TESTS" "$VST3_INFRA_TESTS"; do
            test -f "$f"
            file "$f"
            lipo -info "$f" | tee /tmp/lipo.txt
            grep -q 'x86_64' /tmp/lipo.txt
            ! grep -Eq 'arm64|i386' /tmp/lipo.txt
            otool -l "$f" > /tmp/otool.txt
            grep -A6 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' /tmp/otool.txt
            grep -Eq '10\.13|10\.13\.0' /tmp/otool.txt
          done
          nm -gU "$PLUGIN_BIN" | grep GetPluginFactory
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist" | grep '^0.16.0$'

      - name: Run CoreAudio enumeration smoke
        run: "$CORE_AUDIO_SMOKE"

      - name: Configure ASan + UBSan VST3 build
        run: |
          set -euxo pipefail
          cmake -S _silveton_src/SilvetonDAW -B build-san \
            -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13 \
            -DSILVETON_ENABLE_SANITIZERS=ON \
            -DSILVETON_ENABLE_VST3_HOST=ON \
            -DSILVETON_BUILD_VST3_VALIDATOR=OFF \
            -DSILVETON_VST3_SDK_DIR="$GITHUB_WORKSPACE/vst3sdk" \
            -DSMTG_BUILD_UNIVERSAL_BINARY=OFF \
            -DSMTG_CREATE_PLUGIN_LINK=OFF

      - name: Build ASan + UBSan
        run: cmake --build build-san --config Debug --parallel 2

      - name: Run ASan + UBSan regression suite
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san -C Debug --output-on-failure

      - name: Package validation artifact
        run: |
          set -euxo pipefail
          rm -rf artifact SilvetonDAW-Intel-validation.zip
          mkdir artifact
          ditto "$APP" "artifact/Silveton.app"
          ditto "$PLUGIN" "artifact/SilvetonHostTest.vst3"
          cp "$VST3_SCANNER" "$VST3_HOST_TESTS" "$VST3_INFRA_TESTS" "$CORE_AUDIO_SMOKE" "$AUDIO_CORE_LIB" artifact/
          cp _silveton_src/SilvetonDAW/CURRENT_DEVELOPMENT_STATUS.md artifact/
          cp _silveton_src/SilvetonDAW/GUI_WORKFLOW_STATUS.md artifact/
          cp _silveton_src/SilvetonDAW/VST3_LAYER_STATUS.md artifact/
          cp _silveton_src/SilvetonDAW/TEST_RESULTS.txt artifact/
          ditto -c -k --sequesterRsrc --keepParent artifact SilvetonDAW-Intel-validation.zip

      - name: Upload validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: SilvetonDAW-Intel-validation
          path: SilvetonDAW-Intel-validation.zip
          if-no-files-found: error
